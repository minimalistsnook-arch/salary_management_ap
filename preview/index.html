<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>실시간 미리보기</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f3f5fa; color: #172033; font-family: system-ui, sans-serif; }
      main { width: min(100%, 640px); padding: clamp(24px, 6vw, 56px); background: white; border: 1px solid #e2e7f0; border-radius: 24px; box-shadow: 0 20px 60px #1720330a; }
      .badge { display: inline-block; padding: 6px 12px; border-radius: 99px; background: #eaf7ee; color: #237241; font-size: 14px; }
      h1 { margin: 24px 0 16px; font-size: clamp(28px, 5vw, 40px); letter-spacing: -0.04em; }
      p { line-height: 1.8; color: #596579; word-break: keep-all; }
      code { background: #f0f3f8; padding: 3px 6px; border-radius: 5px; }
    </style>
  </head>
  <body>
    <!-- 아래 내용을 수정하고 저장하면 Vite 미리보기가 자동으로 새로고침됩니다. -->
    <main>
      <span class="badge">미리보기 준비 완료</span>
      <h1>여기서 바로 확인하세요.</h1>
      <p><code>preview/index.html</code>의 글자, 색상, 레이아웃을 자유롭게 수정해 보세요.</p>
      <p>개발 서버가 실행 중이면 저장한 내용이 이 화면에 자동으로 반영됩니다.</p>
    </main>
  </body>
</html>
